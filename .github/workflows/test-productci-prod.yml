name: Product API CRUD CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  crud-test:
    name: crud-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      PORT: "3000"
      MONGO_URI: mongodb://127.0.0.1:27017/productdb_ci

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Cai thu vien
        run: npm ci

      - name: Khoi dong Product API
        run: |
          node src/server.js > api.log 2>&1 &
          echo $! > api.pid

      - name: Cho API va MongoDB san sang
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --max-time 3 \
              http://127.0.0.1:3000/health; then
              echo ""
              echo "API va MongoDB da san sang"
              exit 0
            fi
            sleep 2
          done

          echo "API khong san sang trong thoi gian cho"
          cat api.log
          exit 1

      - name: Kiem thu healthcheck va CRUD
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");
          const base = "http://127.0.0.1:3000";

          async function request(method, path, body) {
            const response = await fetch(base + path, {
              method,
              headers: {
                "Content-Type": "application/json"
              },
              body: body === undefined
                ? undefined
                : JSON.stringify(body),
              signal: AbortSignal.timeout(5000)
            });

            const data = await response.json();

            return {
              status: response.status,
              data
            };
          }

          function expectStatus(result, expected) {
            assert.equal(
              result.status,
              expected,
              JSON.stringify(result.data)
            );
          }

          async function main() {
            let result = await request("GET", "/health");
            expectStatus(result, 200);
            assert.equal(result.data.status, "ok");
            assert.equal(result.data.mongodb, "connected");
            console.log("PASS: Healthcheck API va MongoDB");

            const product = {
              pid: "CI001",
              pname: "Ban phim",
              price: 250000,
              quantity: 10
            };

            result = await request(
              "POST",
              "/api/products",
              product
            );
            expectStatus(result, 201);
            assert.equal(result.data.pid, product.pid);
            console.log("PASS: Tao san pham");

            result = await request(
              "POST",
              "/api/products",
              product
            );
            expectStatus(result, 409);
            console.log("PASS: Tu choi pid trung");

            result = await request("GET", "/api/products");
            expectStatus(result, 200);
            assert.ok(Array.isArray(result.data));
            assert.ok(
              result.data.some(p => p.pid === product.pid)
            );
            console.log("PASS: Lay danh sach san pham");

            result = await request(
              "GET",
              "/api/products/CI001"
            );
            expectStatus(result, 200);
            assert.equal(result.data.pname, product.pname);
            assert.equal(result.data.price, product.price);
            assert.equal(result.data.quantity, product.quantity);
            console.log("PASS: Doc chi tiet san pham");

            const updated = {
              pname: "Ban phim co",
              price: 350000,
              quantity: 15
            };

            result = await request(
              "PUT",
              "/api/products/CI001",
              updated
            );
            expectStatus(result, 200);

            result = await request(
              "GET",
              "/api/products/CI001"
            );
            expectStatus(result, 200);
            assert.equal(result.data.pname, updated.pname);
            assert.equal(result.data.price, updated.price);
            assert.equal(result.data.quantity, updated.quantity);
            console.log("PASS: Cap nhat va doc lai san pham");

            result = await request(
              "POST",
              "/api/products",
              {
                pid: "INVALID_PRICE",
                pname: "San pham loi",
                price: -1,
                quantity: 1
              }
            );
            expectStatus(result, 400);
            console.log("PASS: Tu choi gia am");

            result = await request(
              "POST",
              "/api/products",
              {
                pid: "INVALID_QUANTITY",
                pname: "San pham loi",
                price: 1000,
                quantity: 1.5
              }
            );
            expectStatus(result, 400);
            console.log("PASS: Tu choi so luong khong nguyen");

            result = await request(
              "POST",
              "/api/products",
              {}
            );
            expectStatus(result, 400);
            console.log("PASS: Tu choi du lieu thieu");

            result = await request(
              "DELETE",
              "/api/products/CI001"
            );
            expectStatus(result, 200);

            result = await request(
              "GET",
              "/api/products/CI001"
            );
            expectStatus(result, 404);
            console.log("PASS: Xoa san pham");

            console.log("TAT CA KIEM THU DA THANH CONG");
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Xem log API khi loi
        if: failure()
        run: cat api.log || true

      - name: Dung API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi

  publish:
    name: publish
    needs: crud-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Dang nhap Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t thanhbang0162/product-api:latest \
            -t thanhbang0162/product-api:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push thanhbang0162/product-api:${{ github.sha }}
          docker push thanhbang0162/product-api:latest

  deploy-local:
    name: deploy-local
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    defaults:
      run:
        shell: powershell
        working-directory: C:\Users\Bang\projects\product-api

    steps:
      - name: Kiem tra Docker va file cau hinh
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop chua san sang"
          }

          if (-not (Test-Path "docker-compose-prod.yaml")) {
            throw "Khong tim thay docker-compose-prod.yaml"
          }

          if (-not (Test-Path ".env")) {
            throw "Khong tim thay file .env tren may local"
          }

          docker compose -f docker-compose-prod.yaml config --quiet
          if ($LASTEXITCODE -ne 0) {
            throw "Cau hinh Docker Compose khong hop le"
          }

      - name: Tai image tu Docker Hub
        run: |
          docker compose -f docker-compose-prod.yaml pull api
          if ($LASTEXITCODE -ne 0) {
            throw "Khong tai duoc image tu Docker Hub"
          }

      - name: Cap nhat container va cho healthcheck
        run: |
          docker compose -f docker-compose-prod.yaml up -d --wait --wait-timeout 120
          if ($LASTEXITCODE -ne 0) {
            throw "Trien khai hoac healthcheck that bai"
          }

      - name: Kiem tra API sau trien khai
        run: |
          $result = Invoke-RestMethod `
            -Uri "http://127.0.0.1:3000/health" `
            -TimeoutSec 10

          if ($result.status -ne "ok" -or $result.mongodb -ne "connected") {
            throw "API hoac MongoDB chua san sang"
          }

          $result | ConvertTo-Json

          docker compose -f docker-compose-prod.yaml ps
          if ($LASTEXITCODE -ne 0) {
            throw "Khong doc duoc trang thai container"
          }

      - name: Xem log khi trien khai loi
        if: failure()
        run: |
          docker compose -f docker-compose-prod.yaml ps
          docker compose -f docker-compose-prod.yaml logs --tail 80